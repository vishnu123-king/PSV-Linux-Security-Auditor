[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psv-cli"
version = "1.0.0"
description = "Command-line interface for the PSV Linux Security Auditor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.1"
]

[project.scripts]
psv = "psv.main:cli_app"
